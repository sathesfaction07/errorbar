name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # [dev] includes the four reference packages the crosschecks compare against. Without
      # them a crosscheck becomes COULD_NOT_RUN -- the gap the 3-state exit code exposes.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # Exit 0 = every required claim conclusive and passing; 1 = a measured FAIL;
      # 2 = a required claim never verified. Any non-zero fails the build, which is the point.
      - name: Capstone run
        run: python run_capstone.py

      - name: findings.json is reproducible
        run: git diff --exit-code findings.json
